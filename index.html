<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shishi's Poems</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
background:#faf8f6;
color:#333;

user-select:none;
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
}

/* ❌ REMOVED GLOBAL WATERMARK (replaced with per-poem watermark) */

/* HEADER */
header{
background:#fff;
padding:40px 20px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:1000;
}

/* CONTAINER */
.container{
width:90%;
max-width:900px;
margin:auto;
padding:40px 0;
padding-top:60px;
}

header h1{
font-size:42px;
letter-spacing:2px;
}

header p{
margin-top:10px;
color:#666;
}

#search{
margin-top:20px;
padding:12px;
width:90%;
max-width:500px;
border-radius:30px;
border:1px solid #ccc;
font-size:16px;
}

/* CARDS */
.card{
background:white;
padding:25px;
margin-bottom:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
transition:.3s;

}

.card:hover{
transform:translateY(-5px);
}

.card h2{margin-bottom:10px;}
.card small{color:gray;}
.card p{
margin-top:15px;
line-height:1.7;
}

/* BUTTON */
button{
margin-top:20px;
padding:10px 20px;
background:#222;
color:white;
border:none;
border-radius:30px;
cursor:pointer;
}

button:hover{background:#444;}

/* ARTICLE VIEW */
#articleView{
display:none;
position:relative;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

#articleView h1{margin-bottom:10px;}

#articleView p{
line-height:1.9;
margin-top:20px;
white-space:pre-line;
}

.back{margin-bottom:30px;}

footer{
padding:40px;
text-align:center;
color:#777;
}

/* 🌟 Focus glow */
.focus-mode{
animation: glowPulse 1.2s ease-in-out infinite;
transform: scale(1.01);
transition: all 0.4s ease;
}

@keyframes glowPulse{
0%{box-shadow:0 0 10px rgba(255,200,100,0.2);}
50%{box-shadow:0 0 25px rgba(255,180,80,0.6);}
100%{box-shadow:0 0 10px rgba(255,200,100,0.2);}
}

/* ✨ SPOTLIGHT MODE (NEW) */
body.spotlight header,
body.spotlight footer,
body.spotlight #home{
opacity:0.08;
pointer-events:none;
transition:0.4s ease;
}

body.spotlight #articleView{
position:relative;
z-index:9999;
}

/* ✨ PER POEM WATERMARK (NEW) */
.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:42px;
color:rgba(0,0,0,0.06);
pointer-events:none;
white-space:nowrap;
z-index:0;
}

/* PRINT LOCK + CLEAN VIEW */
@media print{
header, footer, #home, .back, button{
display:none !important;
}

#articleView{
box-shadow:none;
}
}

/* ✨ Typing animation footer */
/* 🌫️ SMOKE / INK REVEAL FOOTER */
.typing{
display:inline-block;
opacity:0;
filter:blur(8px);
letter-spacing:2px;
transform:translateY(6px);
position:relative;
font-weight:bold;

background:linear-gradient(
90deg,
#8b5e00,
#d4af37,
#fff2a8,
#d4af37,
#8b5e00
);

background-size:300% auto;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:
smokeReveal 3.2s ease forwards,
goldFlow 8s linear infinite;
}

/* main reveal */
@keyframes smokeReveal{
0%{
opacity:0;
filter:blur(12px);
transform:translateY(10px);
}

40%{
opacity:0.4;
filter:blur(6px);
transform:translateY(4px);
}

70%{
opacity:0.8;
filter:blur(2px);
transform:translateY(0px);
}

100%{
opacity:1;
filter:blur(0px);
transform:translateY(0px);
}
}

/* 🌫️ subtle floating fumes */
.typing::after{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:radial-gradient(circle at 20% 50%, rgba(255,255,255,0.25), transparent 60%),
radial-gradient(circle at 80% 40%, rgba(180,180,180,0.15), transparent 60%);
opacity:0;
animation:fume 3.2s ease forwards;
mix-blend-mode:screen;
pointer-events:none;
}

@keyframes fume{
0%{opacity:0;}
30%{opacity:0.6; transform:translateY(2px);}
100%{opacity:0;}
}

@keyframes goldFlow{
0%{
background-position:0% center;
}
100%{
background-position:300% center;
}
}

/* BLOCK SELECTION */
::selection{
background:transparent;
}
</style>
</head>

<body>

<header>
<h1>SHISHI'S POEMS</h1>
<p>Where words become memories.</p>

<input id="search" type="text"
placeholder="Search articles..."
onkeyup="searchArticles()">
</header>

<div class="container">

<div id="home"></div>

<div id="articleView">

<button class="back" onclick="goHome()">← Back</button>

<div class="watermark" id="watermark"></div>

<h1 id="title"></h1>
<small id="date"></small>
<p id="content"></p>

</div>

</div>

<footer>
<span id="footerText" class="typing">Made with 🖋 silence by Shishi | © siva80mail@gmail.com | 2026 | ownership Shishi, siva80mail@gmail.com</span>
</footer>

<script>

const articles=[

{
title:"Poem1",
date:"2026",
content:`Once lived a pioneer of creation,
As he splashed his paint thru the blank canvas
It was filled with life
Well renowned and talented as he is,
Thousands admired his work of lines and figures

But as the dawn broke,
He threw the canvas of wonder
There laid a new one which was dull and blank
As he drew his tools and captured the piece,
It became into a new and unexplored genre of his

Thousands became millions,
Passion became greed
The lines and figures became desperation
Fame poured but his expression was blunt

Lost in the intoxication,
His hesitant hand took the life of canvas
He splattered his grape elixir out of despair,
Sparred within his own determination

The once loved artist now became a crowd for commoners,
All glory and love was received
But as the realisation hit him,
He was no less than his admirers 

As rage filled his delicate heart,
He faintly stumbled upon his last creation;
Namely, the art for few
Atlas, his paintbrush dropped dead..
Just like his art`
},

{
title:"Poem2",
date:"2026",
content:`Poem2 is getting readied`
},

{
title:"Poem3",
date:"2026",
content:`Poem2 is getting readied`
},

];

const home=document.getElementById("home");

function loadArticles(list){

    home.innerHTML = "";
    document.getElementById("articleView").style.display = "none";
    home.style.display = "block";

    list.forEach(article=>{

        let realIndex = articles.findIndex(a =>
            a.title.toLowerCase() === article.title.toLowerCase()
        );

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h2>${article.title}</h2>
            <small>${article.date}</small>
            <p>${article.content.substring(0,120)}...</p>
            <button onclick="readArticle(${realIndex})">
                Read Article →
            </button>
        `;

        home.appendChild(card);

    });

}

function readArticle(index){

// 🌟 Spotlight Mode ON
document.body.classList.add("spotlight");

home.style.display="none";
document.getElementById("articleView").style.display="block";
document.getElementById("articleView").classList.add("focus-mode");

document.getElementById("title").innerText=articles[index].title;
document.getElementById("date").innerText=articles[index].date;
document.getElementById("content").innerText=articles[index].content;

// ✨ PER-POEM WATERMARK
document.getElementById("watermark").innerText =
articles[index].title + " • SHISHI'S POEMS © 2026";

window.scrollTo(0,0);
}

function goHome(){

document.body.classList.remove("spotlight");

document.getElementById("articleView").style.display="none";
document.getElementById("articleView").classList.remove("focus-mode");

home.style.display="block";

window.scrollTo(0,0);
}

function searchArticles(){

    const keyword = document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    // Show all poems if search box is empty
    if(keyword === ""){
        loadArticles(articles);
        return;
    }

    // Filter ONLY by title (case-insensitive)
    const filtered = articles.filter(article =>
        article.title.toLowerCase().includes(keyword)
    );

    loadArticles(filtered);

}

document.addEventListener("DOMContentLoaded", function(){
loadArticles(articles);
});

// ESC clears the search and shows all poems
document.getElementById("search").addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        e.preventDefault();

        this.value = "";
        loadArticles(articles);

        this.focus();

    }

});



/* ANTI COPY + PRINT LOCK */
document.addEventListener("contextmenu", function(e){
e.preventDefault();
});

document.addEventListener("keydown", function(e){

// COPY LOCK
if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c"){
e.preventDefault();
alert("Content is protected.");
}

// PRINT LOCK
if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p"){
e.preventDefault();
alert("Printing is disabled for this content.");
}

});

</script>

</body>
</html>
